[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sema-sedd"
version = "0.1.0"
description = "Local-first semantic explorer and comparison engine for SEDD interfaces"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Vamsi Sudhakaran"}]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Typing :: Typed"]
dependencies = []

[project.urls]
Repository = "https://github.com/VamsiSudhakaran1/sedd_semantic_interface"

[project.scripts]
sedd = "sema_sedd.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sema_sedd = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
